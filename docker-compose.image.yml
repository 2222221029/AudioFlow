services:
  audioflow:
    # 国内网络注意：ghcr.io 的 blob 会 307 跳转到 pkg-containers.githubusercontent.com，
    # 该域名在国内不可达 —— 现象就是拉取进度条爬到某个百分比后几乎不动（卡在 163MB
    # 那个大层上永远下不完）。这里改走国内 ghcr 代理，实测 21MB/s。
    # 若你的网络能直连 ghcr.io，把域名换回 ghcr.io 即可。
    #
    # 这里固定到具体版本号（而不是 :latest）：飞牛的容器列表会直接显示这个 tag，
    # 一眼能看出跑的是哪一版；升级时把下面这行的版本号改掉再 up -d 即可。
    # 想自动跟随最新版，把版本号换成 latest 并保留 pull_policy: always。
    image: ghcr.dockerproxy.net/2222221029/audioflow:1.0.30
    pull_policy: always
    container_name: audioflow
    ports:
      - "8082:8082"
    volumes:
      - /vol1/1000/docker/audioflow/data:/app/data
      - /vol1/1000/docker/audioflow/config:/app/config
      - /vol1/1000/docker/audioflow/logs:/app/logs
      - /vol1/1000/downloads/有声书:/app/downloads
      - /vol1/1000/docker/audioflow/workspace:/workspace
    restart: unless-stopped
    environment:
      - TZ=Asia/Shanghai
      # 必须与旧容器保持一致，否则已加密 Cookie 无法读取。
      - AUDIOFLOW_COOKIE_SECRET=${AUDIOFLOW_COOKIE_SECRET:?请设置 AUDIOFLOW_COOKIE_SECRET}
      - XIMALAYA_TICKET_MODE=local
