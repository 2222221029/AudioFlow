services:
  audioflow:
    # 国内网络注意：ghcr.io 的 blob 会 307 跳转到 pkg-containers.githubusercontent.com，
    # 该域名在国内不可达 —— 现象就是拉取进度条爬到某个百分比后几乎不动。这里改走
    # 国内 ghcr 代理（dockerproxy 实测 21MB/s；首次拉某 tag 时代理会回源 ghcr.io
    # 缓存一次，之后秒级；若该代理不稳可把域名换成 ghcr.nju.edu.cn 等镜像）。
    #
    # 推荐用法（避免每次在 NAS 上 --build 长时间重装依赖）：
    #   1) 首次/升级：改下面版本号 → docker compose -f docker-compose.image.yml pull
    #   2) 启动/更新容器：docker compose -f docker-compose.image.yml up -d
    # 想自动跟随最新版：把版本号改成 latest 并保留 pull_policy: always。
    image: ghcr.dockerproxy.net/2222221029/audioflow:1.0.47
    pull_policy: always
    container_name: audioflow
    ports:
      - "8082:8082"
    volumes:
      - /vol1/1000/docker/audioflow/data:/app/data
      - /vol1/1000/docker/audioflow/config:/app/config
      - /vol1/1000/docker/audioflow/logs:/app/logs
      - /vol1/1000/downloads/有声书:/app/downloads
      - /vol1/1000/docker/audioflow/workspace:/workspace
    restart: unless-stopped
    environment:
      - TZ=Asia/Shanghai
      # 必须与旧容器保持一致，否则已加密 Cookie 无法读取。
      - AUDIOFLOW_COOKIE_SECRET=${AUDIOFLOW_COOKIE_SECRET:?请设置 AUDIOFLOW_COOKIE_SECRET}
      - XIMALAYA_TICKET_MODE=local
