services:
  audioflow:
    image: ghcr.io/2222221029/audioflow:latest
    pull_policy: always
    container_name: audioflow
    ports:
      - "8082:8082"
    volumes:
      - /vol1/1000/docker/audioflow/data:/app/data
      - /vol1/1000/docker/audioflow/config:/app/config
      - /vol1/1000/docker/audioflow/logs:/app/logs
      - /vol1/1000/downloads/有声书:/app/downloads
      - /vol1/1000/docker/audioflow/workspace:/workspace
    restart: unless-stopped
    environment:
      - TZ=Asia/Shanghai
      # 必须与旧容器保持一致，否则已加密 Cookie 无法读取。
      - AUDIOFLOW_COOKIE_SECRET=${AUDIOFLOW_COOKIE_SECRET:?请设置 AUDIOFLOW_COOKIE_SECRET}
      - XIMALAYA_TICKET_MODE=local
