name: Build Docker image

on:
  push:
    branches:
      - main
    # 参考 immich 等项目的做法：只改动文档/资源文件时不触发镜像构建，
    # 避免无关提交浪费构建时长
    paths-ignore:
      - 'README.md'
      - 'docs/**'
      - 'assets/**'
      - 'ACCEPTANCE_REPORT.md'
      - 'AudioFlow_验收报告.md'
      - '.gitignore'
      - '*.md'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-image-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: 2222221029/audioflow

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read version
        id: version
        shell: bash
        run: |
          version="$(tr -d '[:space:]' < VERSION)"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+(\.[0-9]+)?$ ]]; then
            echo "Invalid VERSION: $version" >&2
            exit 1
          fi
          echo "value=$version" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 不传 build-args → Dockerfile 使用官方源（海外 runner 最快）。
      # 国内源（阿里云/npmmirror）只应在飞牛 NAS 本地构建时经 docker-compose.yml 传入。
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.value }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.title=AudioFlow
            org.opencontainers.image.description=AudioFlow NAS Web/PWA audiobook downloader
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.version.outputs.value }}
          cache-from: type=gha,scope=audioflow
          cache-to: type=gha,mode=max,scope=audioflow
