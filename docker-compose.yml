services:
  audioflow:
    build: .
    container_name: audioflow
    restart: unless-stopped
    environment:
      AUDIOFLOW_DEFAULT_USERNAME: ${AUDIOFLOW_DEFAULT_USERNAME:-admin}
      AUDIOFLOW_DEFAULT_PASSWORD: ${AUDIOFLOW_DEFAULT_PASSWORD:-admin}
      AUDIOFLOW_COOKIE_SECRET: ${AUDIOFLOW_COOKIE_SECRET:-}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-}
      AUDIOFLOW_ALLOW_RAW_AUDIO_PROXY: ${AUDIOFLOW_ALLOW_RAW_AUDIO_PROXY:-false}
      AUDIOFLOW_LOG_LEVEL: ${AUDIOFLOW_LOG_LEVEL:-INFO}
      AUDIOFLOW_PLATFORM_VERBOSE: ${AUDIOFLOW_PLATFORM_VERBOSE:-0}
      AUDIOFLOW_DOWNLOAD_VERBOSE: ${AUDIOFLOW_DOWNLOAD_VERBOSE:-0}
      XIMALAYA_WEB_V3_ATTEMPTS: ${XIMALAYA_WEB_V3_ATTEMPTS:-5}
      XIMALAYA_WEB_V3_RETRY_BASE: ${XIMALAYA_WEB_V3_RETRY_BASE:-1}
      XIMALAYA_WEB_V3_MAX_BACKOFF: ${XIMALAYA_WEB_V3_MAX_BACKOFF:-120}
      XIMALAYA_WEB_V3_RATE_LIMIT_COOLDOWN: ${XIMALAYA_WEB_V3_RATE_LIMIT_COOLDOWN:-15}
      XIMALAYA_WEB_V3_MIN_INTERVAL: ${XIMALAYA_WEB_V3_MIN_INTERVAL:-0.25}
      XIMALAYA_WEB_V3_MAX_INTERVAL: ${XIMALAYA_WEB_V3_MAX_INTERVAL:-5}
      XIMALAYA_WEB_V3_JITTER: ${XIMALAYA_WEB_V3_JITTER:-0.05}
      XIMALAYA_WEB_V3_RECOVERY_SUCCESSES: ${XIMALAYA_WEB_V3_RECOVERY_SUCCESSES:-24}
      XIMALAYA_TICKET_PROVIDER_URL: ${XIMALAYA_TICKET_PROVIDER_URL:-}
      XIMALAYA_TICKET_PROVIDER_TOKEN: ${XIMALAYA_TICKET_PROVIDER_TOKEN:-}
      XIMALAYA_TICKET_MODE: ${XIMALAYA_TICKET_MODE:-local}
      XIMALAYA_LOCAL_TICKET_TTL_SECONDS: ${XIMALAYA_LOCAL_TICKET_TTL_SECONDS:-0}
      XIMALAYA_V4_REQUESTS_PER_HOUR: ${XIMALAYA_V4_REQUESTS_PER_HOUR:-0}
      XIMALAYA_V4_MIN_INTERVAL: ${XIMALAYA_V4_MIN_INTERVAL:-0.25}
      XIMALAYA_V4_JITTER: ${XIMALAYA_V4_JITTER:-0.05}
      XIMALAYA_V4_CONTROL_CONCURRENCY: ${XIMALAYA_V4_CONTROL_CONCURRENCY:-2}
      XIMALAYA_V4_TRANSIENT_ATTEMPTS: ${XIMALAYA_V4_TRANSIENT_ATTEMPTS:-12}
      XIMALAYA_V4_RECOVERY_SUCCESSES: ${XIMALAYA_V4_RECOVERY_SUCCESSES:-24}
      XIMALAYA_V4_MAX_INTERVAL: ${XIMALAYA_V4_MAX_INTERVAL:-30}
      XIMALAYA_V4_COOLDOWN_SECONDS: ${XIMALAYA_V4_COOLDOWN_SECONDS:-60}
      XIMALAYA_V4_MAX_COOLDOWN_SECONDS: ${XIMALAYA_V4_MAX_COOLDOWN_SECONDS:-3600}
      # 懒人听书下载调优（默认值见 .env.example，不设则用代码内置默认）
      LRTS_DOWNLOAD_THREADS: ${LRTS_DOWNLOAD_THREADS:-3}
      LRTS_AUDIO_CONCURRENCY: ${LRTS_AUDIO_CONCURRENCY:-2}
      LRTS_MIN_REQUEST_INTERVAL: ${LRTS_MIN_REQUEST_INTERVAL:-0.3}
      LRTS_START_REQUEST_INTERVAL: ${LRTS_START_REQUEST_INTERVAL:-0.5}
      LRTS_MAX_REQUEST_INTERVAL: ${LRTS_MAX_REQUEST_INTERVAL:-8.0}
      FANQIE_DOWNLOAD_THREADS: ${FANQIE_DOWNLOAD_THREADS:-3}
    volumes:
      - ${AUDIOFLOW_DATA_DIR:-./data}:/app/data
      - ${AUDIOFLOW_CONFIG_DIR:-./config}:/app/config
      - ${AUDIOFLOW_LOG_DIR:-./logs}:/app/logs
      - ${AUDIOFLOW_DOWNLOAD_DIR:-./downloads}:/app/downloads
      - ./workspace:/workspace
    ports:
      - "${WEB_PORT:-8082}:8082"
